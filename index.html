<!doctype html>
<html lang="ja" data-bs-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AXT_AyaKoto's CP Portfolio</title>
        <!-- Bootstrap (via jsDelivr) -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"
        ></script>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" type="module"></script>
    </head>
    <body class="d-flex flex-column min-vh-100">
        <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="#">AXT_AyaKoto's CP Portfolio</a>
            </div>
        </nav>
        <main class="container flex-grow-1 py-4">
            <hgroup>
                <h1 class="display-5">AXT_AyaKoto</h1>
                <p class="lead text-muted">Competitive Programming Profiles</p>
            </hgroup>
            <section class="mb-4">
                <h2 class="h2 mb-4">AtCoder (Algorithm)</h2>
                <div class="row g-3 justify-content-center">
                    <div class="col-12 col-md-4">
                        <div class="card h-100">
                            <div class="card-body text-center d-flex flex-column justify-content-center">
                                <h3 class="h6 text-muted text-uppercase mb-2">Current Rating</h3>
                                <p class="display-4 mb-0 stat-value" id="current-rating">-</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="card h-100">
                            <div class="card-body text-center d-flex flex-column justify-content-center">
                                <h3 class="h6 text-muted text-uppercase mb-2">AC Count</h3>
                                <p class="display-4 mb-0 stat-value" id="ac-count">-</p>
                            </div>
                        </div>
                    </div>
                </div>
                <section class="mb-4">
                    <h3 class="h3 mt-4 text-center mb-3">Languages</h3>
                    <ul class="list-unstyled d-flex flex-wrap gap-2 justify-content-center" id="languages"></ul>
                </section>
                <div class="d-flex justify-content-center my-4">
                    <a href="https://atcoder.jp/users/AXT_AyaKoto" class="btn btn-lg btn-secondary">View Profile</a>
                </div>
                <div>
                    <h3>Latest Submissions</h3>
                    <table class="table table-striped text-center align-middle">
                        <thead>
                            <tr>
                                <th class="text-center align-middle">Problem</th>
                                <th class="text-center align-middle">Language</th>
                                <th class="text-center align-middle">Result</th>
                                <th class="text-center align-middle">Link</th>
                            </tr>
                        </thead>
                        <tbody id="submissions-table-body"></tbody>
                    </table>
                </div>
            </section>
        </main>
        <footer class="mt-auto py-4 border-top">
            <div class="container">
                <div
                    class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 text-muted small"
                >
                    <p class="mb-0">&copy; 2026 AXT_AyaKoto</p>
                    <div class="d-flex flex-wrap justify-content-center gap-3">
                        <span class="text-muted">Last Update: <span id="last-updated">N/A</span></span>
                        <a
                            href="https://github.com/AXT-AyaKoto/competitive-programming-portfolio"
                            class="link-secondary"
                            >GitHub</a
                        >
                        <a
                            href="https://github.com/kenkoooo/AtCoderProblems/blob/master/doc/api.md"
                            class="link-secondary"
                            >AtCoder Problems API</a
                        >
                    </div>
                </div>
            </div>
        </footer>
    </body>
</html>
